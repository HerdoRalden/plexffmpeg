name: Build and publish image

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Daily check for a new upstream Plex image; only rebuilds if it changed
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: plexinc/pms-docker:latest
  DOCKERHUB_IMAGE: herdo/plexffmpeg
  GHCR_IMAGE: ghcr.io/herdoralden/plexffmpeg

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: latest
            update_channel: ""
          - tag: plexpass
            update_channel: beta
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new base image
        id: check
        run: |
          base=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)
          echo "Upstream $BASE_IMAGE is $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # Scheduled runs skip the build when our published image was already built from this base,
          # so unRAID doesn't report an update every day
          if [ "${{ github.event_name }}" = schedule ]; then
            current=$(docker buildx imagetools inspect "$GHCR_IMAGE:${{ matrix.tag }}" --format '{{json .Image}}' \
              | jq -r '(if has("config") then . else .["linux/amd64"] end).config.Labels["org.opencontainers.image.base.digest"] // empty') || current=""
            echo "Published $GHCR_IMAGE:${{ matrix.tag }} was built from ${current:-<unknown>}"
            if [ "$current" = "$base" ]; then
              echo "Base image unchanged, skipping build"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.build == 'true'

      - name: Build and push
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Pin the base to the digest we checked, so the label below matches what was actually built
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}@${{ steps.check.outputs.base }}
            PLEX_UPDATE_CHANNEL=${{ matrix.update_channel }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.tag }}
            ${{ env.GHCR_IMAGE }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.base.name=docker.io/${{ env.BASE_IMAGE }}
            org.opencontainers.image.base.digest=${{ steps.check.outputs.base }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
